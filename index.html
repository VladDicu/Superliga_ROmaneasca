<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperLiga & Liga 2 - Footy Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fotbal Românesc: X și 0</h1>
        <p>Găsește fotbalistul care îndeplinește simultan criteriul de pe linie și cel de pe coloană!</p>
        <div class="controls-bar">
            <span id="status-joc">Rândul lui: <strong id="jucator-curent" class="x-color">X</strong></span>
            <button id="btn-random" class="btn">🎲 Generează Grilă Validă</button>
            <button id="btn-reset" class="btn secondary">🔄 Resetează Tabla</button>
        </div>
    </header>

    <main>
        <!-- Tabla de joc generată dinamic din JS -->
        <div id="game-board"></div>
    </main>

    <!-- Fereastra Modală pentru căutarea jucătorului -->
    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modal-title">Caută jucător</h3>
            <p id="modal-subtitle" class="subtitle"></p>
            <input type="text" id="player-search" placeholder="Tastează numele jucătorului..." autocomplete="off">
            <ul id="autocomplete-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
