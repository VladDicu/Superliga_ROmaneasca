<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga 1 Pixel Hub - X & 0</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body data-page="grid">
    <div class="pitch-background">
        <div class="pitch-border">
            <div class="penalty-box top"></div>
            <div class="center-line"></div>
            <div class="center-circle"></div>
            <div class="center-spot"></div>
            <div class="penalty-box bottom"></div>
        </div>
    </div>

    <div class="app-wrapper">
        <header>
            <div class="title-banner"><h1>LIGA 1 PIXEL HUB</h1></div>
            <nav class="arcade-tabs">
                <a href="index.html" class="tab-btn active">🏁 PIXEL GRID (X & 0)</a>
                <a href="clasamente.html" class="tab-btn">🏆 CLASAMENTE & GOLGHETERI</a>
                <a href="meci.html" class="tab-btn">⚽ MECI 11v11 VS AI</a>
            </nav>
        </header>

        <section class="tab-view">
            <div class="controls-bar">
                <div class="turn-indicator">TURĂ: <span id="jucator-curent" class="x-color">X</span></div>
                <div class="action-buttons">
                    <button id="btn-random" class="btn-pixel">🎲 GRILĂ DIVERSIFICATĂ</button>
                    <button id="btn-reset" class="btn-pixel secondary">🔄 RESET</button>
                </div>
            </div>
            <main><div id="game-board"></div></main>
        </section>
    </div>

    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn">[X]</button>
            <h3 id="modal-title">CAUTĂ JUCĂTOR</h3>
            <p id="modal-subtitle" class="subtitle"></p>
            <input type="text" id="player-search" placeholder="TASTEAZĂ NUMELE FOTBALISTULUI..." autocomplete="off">
            <ul id="autocomplete-list"></ul>
        </div>
    </div>

    <script src="script.js?v=6"></script>
</body>
</html>
